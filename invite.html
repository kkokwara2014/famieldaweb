<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5E35B1">
  <meta name="robots" content="noindex, nofollow">
  <title>Care circle invitation — Famielda</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/pages/auth.css">
  <link rel="stylesheet" href="css/pages/invite.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-public-header></header>
  <main id="main">
    <div class="auth-layout">
      <aside class="auth-panel">
        <img class="brand__logo" src="assets/images/logo.png" alt="Famielda" width="48" height="48" decoding="async" fetchpriority="high">
        <div>
          <p class="page-kicker" style="color:#d6c7f5">Care circle</p>
          <h2>A family member invited you to coordinate care.</h2>
          <p>Join the household on Famielda to see the week, the people, and the record they already share.</p>
        </div>
      </aside>
      <div class="auth-card" data-invite-card>
        <div class="loader-block" data-invite-loading>
          <p>Opening your invitation…</p>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer" data-public-footer></footer>
  <script type="module" src="js/pages/invite.js"></script>
</body>
</html>
