<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5E35B1">
  <meta name="robots" content="noindex">
  <title>Notifications — Famielda</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/pages/notifications.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="app-body">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-sidebar-overlay" data-sidebar-overlay hidden></div>
  <div class="app-layout" data-app-layout>
    <aside class="app-sidebar" id="app-sidebar" data-app-sidebar></aside>
    <div class="app-content">
      <header class="app-topbar" data-app-topbar></header>
      <main id="main" class="app-main" data-app-page>
        <div class="notice-page-head">
          <p class="page-lead">Invitations, schedule changes, care reminders, and emergency alerts in one feed.</p>
          <div class="notice-page-head__actions">
            <span class="person__meta" data-notice-unread></span>
            <button class="btn btn--ghost btn--sm" type="button" data-mark-all-read>Mark all read</button>
            <a class="btn btn--ghost btn--sm" href="settings.html?tab=notifications">Preferences</a>
          </div>
        </div>
        <div class="tabs" data-tabs data-notice-tabs>
          <div class="tabs__list" role="tablist" aria-label="Notification filters">
            <button class="tabs__tab is-active" type="button" data-tab="all" aria-selected="true">All</button>
            <button class="tabs__tab" type="button" data-tab="unread" aria-selected="false">Unread</button>
            <button class="tabs__tab" type="button" data-tab="alerts" aria-selected="false">Alerts</button>
          </div>
        </div>
        <section class="card" data-notice-card></section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/pages/notifications.js"></script>
</body>
</html>
