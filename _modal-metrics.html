<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal metrics</title>
</head>
<body>
<pre id="out">loading</pre>
<iframe id="frame" src="/_modal-verify.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    const doc = document.getElementById("frame").contentDocument;
    const modal = doc.querySelector('[data-modal="care-plan"]');
    const panel = modal.querySelector(".modal__panel");
    const actions = modal.querySelector(".modal__actions");
    const cancel = actions.querySelector("[data-close-modal]");
    const save = actions.querySelector("[type='submit']");
    const box = panel.getBoundingClientRect();
    const act = actions.getBoundingClientRect();
    const saveBox = save.getBoundingClientRect();
    const cancelBox = cancel.getBoundingClientRect();
    const view = { w: window.innerWidth, h: window.innerHeight };
    const report = {
      view,
      panel: { top: box.top, left: box.left, right: box.right, bottom: box.bottom, w: box.width, h: box.height },
      actions: { top: act.top, bottom: act.bottom, left: act.left, right: act.right },
      cancel: { right: cancelBox.right, bottom: cancelBox.bottom },
      save: { left: saveBox.left, right: saveBox.right, bottom: saveBox.bottom, w: saveBox.width },
      saveFullyVisible: saveBox.right <= view.w + 1 && saveBox.bottom <= view.h + 1 && saveBox.left >= 0,
      cancelFullyVisible: cancelBox.right <= view.w + 1 && cancelBox.bottom <= view.h + 1,
      centerX: (box.left + box.right) / 2,
    };
    document.getElementById("out").textContent = JSON.stringify(report, null, 2);
    document.title = "ready";
  }, 400);
});
</script>
</body>
</html>
