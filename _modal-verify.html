<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal verify</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body modal-open">
  <main style="padding: 2rem;">
    <h1>Workspace behind modal</h1>
    <p id="results"></p>
  </main>

  <div class="modal" data-modal="care-plan">
    <div class="modal__backdrop"></div>
    <div class="modal__panel modal__panel--lg" role="dialog" aria-modal="true" aria-labelledby="care-plan-title">
      <button type="button" class="modal__dismiss" data-close-modal aria-label="Close dialog">✕</button>
      <h2 id="care-plan-title">Create plan</h2>
      <p class="modal__body">A living plan the circle can follow — goals, notes, and assigned work.</p>
      <form class="form" data-plan-form>
        <div class="field">
          <label for="plan-title">Plan name</label>
          <input id="plan-title" name="title" type="text" required placeholder="Daily support plan">
        </div>
        <div class="field">
          <label for="plan-goal">Goal</label>
          <textarea id="plan-goal" name="goal" rows="2" placeholder="Keep mornings unhurried."></textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="plan-status">Status</label>
            <select id="plan-status" name="status">
              <option>Active</option>
            </select>
          </div>
          <div class="field">
            <label for="plan-start">Start date</label>
            <input id="plan-start" name="startDate" type="date">
          </div>
        </div>
        <div class="field">
          <label for="plan-end">End date</label>
          <input id="plan-end" name="endDate" type="date">
        </div>
        <div class="field">
          <label for="plan-notes">Notes</label>
          <textarea id="plan-notes" name="notes" rows="3" placeholder="Anything the circle should keep in mind."></textarea>
        </div>
        <div class="modal__actions">
          <button class="btn btn--ghost" type="button" data-close-modal>Cancel</button>
          <button class="btn btn--primary" type="submit">Save plan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { bindModal, openModal } from "./js/components/modal.js";

    bindModal("care-plan");
    openModal("care-plan");

    const modal = document.querySelector('[data-modal="care-plan"]');
    const results = document.getElementById("results");
    const log = (line) => { results.textContent += line + "\n"; };

    document.querySelector(".modal__backdrop").dispatchEvent(new MouseEvent("click", { bubbles: true }));
    log("after-backdrop-hidden=" + modal.hidden);

    modal.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    log("after-escape-hidden=" + modal.hidden);

    const box = modal.querySelector(".modal__panel").getBoundingClientRect();
    const view = { w: window.innerWidth, h: window.innerHeight };
    const centeredX = Math.abs((box.left + box.right) / 2 - view.w / 2) < 8;
    const fullyOnScreen = box.top >= 0 && box.bottom <= view.h + 1 && box.left >= 0 && box.right <= view.w + 1;
    const actions = modal.querySelector(".modal__actions").getBoundingClientRect();
    log("centeredX=" + centeredX);
    log("fullyOnScreen=" + fullyOnScreen);
    log("panelWidth=" + Math.round(box.width));
    log("actionsVisible=" + (actions.bottom <= view.h + 1 && actions.top >= 0));

    modal.querySelector(".modal__actions [data-close-modal]").click();
    log("after-cancel-hidden=" + modal.hidden);

    openModal("care-plan");
    modal.querySelector(".modal__dismiss").click();
    log("after-close-hidden=" + modal.hidden);

    openModal("care-plan");
    document.body.dataset.verify = results.textContent.trim();
  </script>
</body>
</html>
